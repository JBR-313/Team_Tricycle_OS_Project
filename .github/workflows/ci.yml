name: ci

# Lightweight pre-demo checks. Intentionally does NOT run QEMU/xv6 in CI
# (QEMU/RISC-V toolchain on GitHub-hosted runners adds significant time and
# brittleness). The authoritative pre-demo check is local:
#   python3 scripts/orchestrator.py --backend xv6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  python:
    name: python compile + contract validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: py_compile every Python module
        run: |
          shopt -s nullglob
          py_files=( tools/*.py scripts/*.py tests/*.py )
          if [ ${#py_files[@]} -eq 0 ]; then
            echo "no Python files found"
            exit 1
          fi
          python3 -m py_compile "${py_files[@]}"
      - name: install dev deps (pytest)
        run: python3 -m pip install -r requirements-dev.txt
      - name: run unit tests (offline; no API key)
        run: python3 -m pytest tests/ -q
      - name: strict validate committed dashboard live-data
        run: |
          python3 tools/validate_dashboard_contract.py \
            --strict --dir dashboard_live/public/live-data

      - name: strict validate preview artifacts (--preview opt-in)
        run: |
          # The committed live-data now ships the after-running preview
          # artifacts (runtime_events.json, correction_proposal.json,
          # correction_guard_decision.json). This step enforces every honesty
          # invariant on them: preview_only=true, applied=false, and no
          # CORRECTION_APPLIED trace event. (When no preview files are present,
          # --preview still passes — they are off the strict default contract.)
          python3 tools/validate_dashboard_contract.py \
            --strict --preview --dir dashboard_live/public/live-data

  dashboard_live:
    name: dashboard_live build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_live
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard_live/package-lock.json
      - run: npm ci
      - run: npm run build
